    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"bipartite": "table", "color": "rgb(126, 0, 255)", "id": "a", "label": "tabula - A", "shape": "dot", "size": 15}, {"bipartite": "column", "color": "#97c2fc", "id": "kopeja", "label": "kopeja", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "a2", "label": "a2", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "a3", "label": "a3", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "kopeja2", "label": "kopeja2", "shape": "dot", "size": 10}, {"bipartite": "table", "color": "rgb(0, 255, 254)", "id": "b", "label": "tabula - B", "shape": "dot", "size": 15}, {"bipartite": "column", "color": "#97c2fc", "id": "b1", "label": "b1", "shape": "dot", "size": 10}, {"bipartite": "table", "color": "rgb(255, 0, 0)", "id": "c", "label": "tabula - C", "shape": "dot", "size": 15}, {"bipartite": "column", "color": "#97c2fc", "id": "c1", "label": "c1", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "c2", "label": "c2", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "c3", "label": "c3", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "c4", "label": "c4", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "c5", "label": "c5", "shape": "dot", "size": 10}, {"bipartite": "table", "color": "rgb(128, 255, 0)", "id": "d", "label": "tabula - D", "shape": "dot", "size": 15}, {"bipartite": "column", "color": "#97c2fc", "id": "d2", "label": "d2", "shape": "dot", "size": 10}, {"bipartite": "column", "color": "#97c2fc", "id": "d3", "label": "d3", "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"from": "a", "to": "kopeja", "width": 1}, {"from": "a", "to": "a2", "width": 1}, {"from": "a", "to": "a3", "width": 1}, {"from": "a", "to": "kopeja2", "width": 1}, {"from": "b", "to": "b1", "width": 1}, {"from": "b", "to": "kopeja", "width": 1}, {"from": "c", "to": "c1", "width": 1}, {"from": "c", "to": "c2", "width": 1}, {"from": "c", "to": "c3", "width": 1}, {"from": "c", "to": "c4", "width": 1}, {"from": "c", "to": "c5", "width": 1}, {"from": "c", "to": "kopeja2", "width": 1}, {"from": "d", "to": "kopeja", "width": 1}, {"from": "d", "to": "d2", "width": 1}, {"from": "d", "to": "d3", "width": 1}, {"from": "d", "to": "kopeja2", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
